# HTTPS port 8443, reachable on this host's network interfaces.
VM_MANAGER_HOST=0.0.0.0
# Open HTTPS in an active firewalld/UFW firewall. Never enables/resets a firewall.
VM_MANAGER_MANAGE_FIREWALL=yes
# Optional firewalld zones; default is active zones except drop/block.
# VM_MANAGER_FIREWALL_ZONES="public"
# Optional published HTTPS origin when behind NAT or a reverse proxy.
# VM_MANAGER_PUBLIC_URL=https://manager.example.com
